name: Python app CI and Docker publish

on:
  push:
    branches: [gha-cicd]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME}}student-task-tracker
  image_tag: ${{ github.sha }}

jobs:
  test:
    name: Test Python application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r student-task-tracker/requirements.txt

      - name: Run tests
        run: pytest -m pytest student-task-tracker/tests/ 

  docker:
    name: Build and publish Docker image
    needs: test
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: student-task-tracker/Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.image_tag }}

      - name: run docker container
        run: |
          docker run -d -p 5000:5000 --name student-task-tracker ${{ env.IMAGE_NAME }}:latest
          sleep 10
          curl -f http://localhost:5000 || exit 1
          docker stop student-task-tracker

      - name: smoke test
        run: |
          docker run -d -p 5000:5000 --name student-task-tracker ${{ env.IMAGE_NAME }}:latest
          sleep 10
          curl -f http://localhost:5000/health || exit 1
          curl -f http://localhost:5000/tasks || exit 1
          curl -f http://localhost:5000/live || exit 1
          curl -f http://localhost:5000/ready || exit 1
          docker stop student-task-tracker

      - name: Push Docker image
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: ./student-task-tracker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.image_tag }}
