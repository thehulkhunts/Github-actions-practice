
name: Three Tier Application CI

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'db/**'
      - '.github/workflows/three-tier-ci.yml'

  # pull_request:
  #   branches:
  #     - master

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: FRONTEND UNIT TESTS
  # ==========================================

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Test Results Directory
        run: mkdir -p frontend/test-results

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: |
          node --test --test-reporter=junit \
            test/*.test.js \
            > test-results/frontend-junit.xml

      - name: Publish Frontend Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Frontend Test Results
          path: frontend/test-results/frontend-junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Frontend Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/
          if-no-files-found: ignore


  # ==========================================
  # JOB 2: BACKEND UNIT TESTS
  # ==========================================

  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Create Test Results Directory
        run: mkdir -p backend/test-results

      - name: Run Backend Unit Tests
        working-directory: backend
        run: |
          node --test --test-reporter=junit \
            test/*.test.js \
            > test-results/backend-junit.xml

      - name: Publish Backend Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Backend Test Results
          path: backend/test-results/backend-junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Backend Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: ignore


  # ==========================================
  # JOB 3: DATABASE TESTS
  # ==========================================

  database-tests:
    name: PostgreSQL Database Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: todoapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d todoapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Test Results Directory
        run: mkdir -p db/test-results

      - name: Run Database Initialization Test
        id: db-test
        continue-on-error: true
        env:
          PGPASSWORD: testpassword
        run: |
          set +e

          psql -h localhost \
            -U appuser \
            -d todoapp \
            -v ON_ERROR_STOP=1 \
            -f db/init.sql \
            > db/test-results/db-output.txt 2>&1

          INIT_STATUS=$?

          if [ "$INIT_STATUS" -eq 0 ]; then
            TASK_COUNT=$(psql -h localhost \
              -U appuser \
              -d todoapp \
              -tA \
              -c "SELECT COUNT(*) FROM tasks;")

            QUERY_STATUS=$?

            if [ "$QUERY_STATUS" -eq 0 ] && [ "$TASK_COUNT" -ge 1 ]; then
              cat > db/test-results/database-junit.xml <<'EOF'
          <testsuites tests="1" failures="0">
            <testsuite name="Database Tests" tests="1" failures="0">
              <testcase classname="PostgreSQL" name="Database initialization and task table validation"/>
            </testsuite>
          </testsuites>
          EOF
              echo "Database initialization successful."
              echo "Tasks found: $TASK_COUNT"
              exit 0
            fi
          fi

          cat > db/test-results/database-junit.xml <<'EOF'
          <testsuites tests="1" failures="1">
            <testsuite name="Database Tests" tests="1" failures="1">
              <testcase classname="PostgreSQL" name="Database initialization and task table validation">
                <failure message="Database initialization or validation failed"/>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

          cat db/test-results/db-output.txt
          exit 1

      - name: Publish Database Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Database Test Results
          path: db/test-results/database-junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload Database Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-test-results
          path: db/test-results/
          if-no-files-found: ignore

      - name: Fail if Database Tests Failed
        if: steps.db-test.outcome == 'failure'
        run: exit 1


  # ==========================================
  # JOB 4: BUILD AND PUSH DOCKER IMAGES
  # ==========================================

  build-and-push:
    name: Build and Push ${{ matrix.component }}
    runs-on: ubuntu-latest

    needs:
      - frontend-tests
      - backend-tests
      - database-tests

    if: >-
      ${{
        needs.frontend-tests.result == 'success' &&
        needs.backend-tests.result == 'success' &&
        needs.database-tests.result == 'success'
      }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - component: database
            context: ./db
            dockerfile: ./db/Dockerfile

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-${{ matrix.component }}:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-${{ matrix.component }}:latest
