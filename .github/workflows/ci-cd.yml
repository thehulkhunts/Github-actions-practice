name: Python app CI and Docker publish

on:
  push:
    branches:
      - gha-cicd
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME}}student-task-tracker
  image_tag: ${{ github.sha }}

jobs:
  test:
    name: Test Python application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python-app/student-task-tracker/requirements.txt

      - name: Create test report directory
        working-directory: python-app/student-task-tracker
        run: mkdir -p reports

      - name: Run tests and generate HTML report
        working-directory: python-app/student-task-tracker
        run: |
          python -m pytest -v tests/ \
           --html=reports/pytest-report.html \
           --self-contained-html
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-task-tracker-test-report
          path: python-app/student-task-tracker/reports/pytest-report.html
          retention-days: 15
          if-no-files-found: warn

  docker:
    name: Build and publish Docker image
    needs: test
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: python-app/student-task-tracker
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.image_tag }}

      - name: run docker container
        run: |
          docker run -d -p 5000:5000 --name student-task-tracker ${{ env.IMAGE_NAME }}:latest
          sleep 10
          curl -f http://localhost:5000 || exit 

          docker stop student-task-tracker
          docker rm student-task-tracker

      - name: smoke test
        run: |
          docker run -d -p 5000:5000 --name student-task-tracker ${{ env.IMAGE_NAME }}:latest
          sleep 10
          curl -f http://localhost:5000/health || exit 1
          curl -f http://localhost:5000/tasks || exit 1
          curl -f http://localhost:5000/live || exit 1
          curl -f http://localhost:5000/ready || exit 1
          docker stop student-task-tracker
          docker rm student-task-tracker

      - name: Push Docker image
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: ./student-task-tracker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.image_tag }}
